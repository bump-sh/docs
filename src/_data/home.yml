paths:
  - title: Publish your API documentation
    icon: documentation
    description: Upload an OpenAPI or AsyncAPI document and get a documentation portal with a changelog, an API explorer and Ask AI. Deploy from the dashboard, the CLI or your CI.
    code: npx bump-cli deploy openapi.yml --doc my-api --token $BUMP_TOKEN
    link: /help/getting-started/upload-your-first-definition/
    link_label: Publish your first doc
  - title: Deploy an MCP server
    icon: mcp
    description: Describe API workflows in a Flower or Arazzo document. Bump.sh hosts an MCP server that runs them for AI agents, with no code and no infrastructure on your side.
    code: npx bump-cli deploy workflow.yml --mcp-server my-server --token $BUMP_TOKEN
    link: /help/getting-started/start-your-first-mcp-server/
    link_label: Start your first MCP server

